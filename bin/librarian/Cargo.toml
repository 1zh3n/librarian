[package]
name = "librarian"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
rust-embed = { workspace = true, features = ["debug-embed"] }
silverbullet-server = { path = "../../server" }
silverbullet-server-common = { path = "../../server-common" }
silverbullet-server-mcp = { path = "../../server-mcp" }
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
reqwest = { workspace = true }
rusqlite = { version = "0.43", features = ["bundled"] }
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
